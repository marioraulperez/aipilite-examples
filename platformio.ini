[env]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; esptool 5.x required in PATH — platform's bundled 4.x doesn't support ESP32-S3 USB JTAG reliably
upload_protocol = custom
upload_command = esptool --chip esp32s3 write-flash 0x0 $BUILD_DIR/bootloader.bin 0x8000 $BUILD_DIR/partitions.bin 0x10000 $SOURCE
platform = espressif32
; https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

[env:basic]
build_src_filter = +<basic/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9

[env:sound]
extra_scripts = pre:scripts/patch_audio_tools_legacy.py
build_src_filter = +<sound/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9
    https://github.com/pschatzmann/arduino-audio-driver#v0.2.1
    https://github.com/pschatzmann/arduino-audio-tools#v1.2.4

[env:rgb]
build_src_filter = +<rgb/>
lib_deps =
    fastled/FastLED@^3.6.0

[env:battery]
build_src_filter = +<battery/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9

[env:pocketjoke]
build_src_filter = +<pocketjoke/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9
    ArduinoJson

[env:roboeyes]
build_src_filter = +<roboeyes/>
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9

[env:planeradar]
build_src_filter = +<planeradar/>
extra_scripts = pre:scripts/patch_audio_tools_legacy.py
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Isrc/planeradar
    -DWM_NODEBUG
    -DWM_MDNS
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    https://github.com/pschatzmann/arduino-audio-driver#v0.2.1
    https://github.com/pschatzmann/arduino-audio-tools#v1.2.4
    mathertel/OneButton@^2.6.1

[env:radio]
platform = espressif32@7.0.1
build_src_filter = +<radio/>
build_unflags = -std=gnu++11
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -Isrc/radio
    -DWM_NODEBUG
    -DWM_MDNS
lib_deps =
    https://github.com/moononournation/Arduino_GFX#v1.5.9
    tzapu/WiFiManager@^2.0.17
    mathertel/OneButton@^2.6.1
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
